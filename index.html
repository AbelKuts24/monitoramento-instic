<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitoramento de Transporte - INSTIC</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; flex-direction: row; height: 100vh; background-color: #f4f6f9; overflow: hidden; }
        #painel { width: 350px; background: #ffffff; padding: 25px; box-shadow: 4px 0 15px rgba(0,0,0,0.1); z-index: 1000; display: flex; flex-direction: column; justify-content: space-between; }
        #mapa { flex: 1; height: 100vh; }
        h2 { color: #1e293b; font-size: 22px; margin-bottom: 20px; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; }
        .info-container { display: flex; flex-direction: column; gap: 15px; }
        .info-box { background: #f8fafc; padding: 15px; border-radius: 8px; border-left: 4px solid #3b82f6; }
        .info-label { font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .info-value { font-size: 18px; color: #0f172a; font-weight: 600; margin-top: 5px; }

        /* MÁGICA RESPONSIVA PARA TELEMÓVEL */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #painel { width: 100%; height: auto; padding: 15px; }
            .info-container { flex-direction: row; gap: 8px; }
            .info-box { flex: 1; padding: 10px; }
            .info-value { font-size: 15px; }
            #mapa { height: calc(100vh - 160px); }
        }
    </style>
</head>
<body>

    <div id="painel">
        <div>
            <h2>📍 Monitoramento</h2>
            <div class="info-container">
                <div class="info-box">
                    <div class="info-label">Distância</div>
                    <div id="distancia-usuario" class="info-value">--</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Chegada (Est.)</div>
                    <div id="tempo-chegada" class="info-value">--</div>
                </div>
            </div>
            <div class="info-box" style="margin-top: 15px;">
                <div class="info-label">Velocidade</div>
                <div id="veiculo-velocidade" class="info-value">0.0 km/h</div>
            </div>
        </div>
    </div>

    <div id="mapa"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAsg5cyS2BdWTPgmUpELMy-0GMKXZjv7d8",
            databaseURL: "https://monitoramento-transporte-default-rtdb.europe-west1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const mapa = L.map('mapa').setView([-9.051227, 13.398332], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(mapa);
        let marcadorAutocarro = L.marker([-9.051227, 13.398332]).addTo(mapa);

        let userLat, userLng;
        navigator.geolocation.watchPosition((pos) => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
        }, (err) => console.error("GPS indisponível"));

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        database.ref('/transporte').on('value', (snapshot) => {
            const dados = snapshot.val();
            if (dados) {
                marcadorAutocarro.setLatLng([dados.latitude, dados.longitude]);
                document.getElementById('veiculo-velocidade').innerText = dados.velocidade.toFixed(1) + " km/h";

                if (userLat) {
                    const dist = calcularDistancia(userLat, userLng, dados.latitude, dados.longitude);
                    const tempo = (dados.velocidade > 0.5) ? (dist / dados.velocidade) * 60 : 0;
                    document.getElementById('distancia-usuario').innerText = dist.toFixed(2) + " km";
                    document.getElementById('tempo-chegada').innerText = tempo.toFixed(0) + " min";
                }
            }
        });
    </script>
</body>
</html>
