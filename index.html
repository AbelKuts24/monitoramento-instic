<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monitoramento INSTIC</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; flex-direction: row; height: 100vh; background-color: #f4f6f9; overflow: hidden; }
        
        #painel { width: 350px; background: #ffffff; padding: 20px; box-shadow: 4px 0 15px rgba(0,0,0,0.1); z-index: 1000; display: flex; flex-direction: column; gap: 15px; }
        #mapa { flex: 1; height: 100vh; }
        
        h2 { color: #1e293b; font-size: 20px; border-bottom: 2px solid #10b981; padding-bottom: 5px; }
        .btn-gps { background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-share { background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .info-container { display: flex; flex-direction: column; gap: 10px; }
        .info-box { background: #f8fafc; padding: 12px; border-radius: 8px; border-left: 4px solid #10b981; }
        .info-label { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: bold; }
        .info-value { font-size: 16px; color: #0f172a; font-weight: 600; }

        #qr-modal { display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%); background:white; padding:20px; border-radius:10px; box-shadow:0 0 20px rgba(0,0,0,0.3); z-index:2000; text-align:center; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #painel { width: 100%; height: auto; padding: 15px; order: 1; }
            .info-container { flex-direction: row; gap: 8px; }
            .info-box { flex: 1; padding: 8px; }
            #mapa { height: calc(100vh - 250px); order: 2; }
        }
    </style>
</head>
<body>

    <div id="painel">
        <h2>📍 Monitoramento Pro</h2>
        <button class="btn-gps" onclick="pedirLocalizacao()">📍 Sincronizar Localização</button>
        <button class="btn-share" onclick="document.getElementById('qr-modal').style.display='block'">📱 Partilhar App (QR)</button>
        
        <div class="info-container">
            <div class="info-box"><div class="info-label">Distância</div><div id="dist" class="info-value">--</div></div>
            <div class="info-box"><div class="info-label">Previsão</div><div id="eta" class="info-value">--</div></div>
        </div>
        <div class="info-box"><div class="info-label">Velocidade Atual</div><div id="vel" class="info-value">0.0 km/h</div></div>
    </div>

    <div id="qr-modal">
        <p>Escanear para aceder:</p>
        <div id="qrcode" style="margin: 15px auto;"></div>
        <button onclick="document.getElementById('qr-modal').style.display='none'">Fechar</button>
    </div>

    <div id="mapa"></div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAsg5cyS2BdWTPgmUpELMy-0GMKXZjv7d8", databaseURL: "https://monitoramento-transporte-default-rtdb.europe-west1.firebasedatabase.app" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const mapa = L.map('mapa').setView([-9.051227, 13.398332], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

        // Ícones Personalizados
        const busIcon = L.icon({ iconUrl: 'img/autocarro.png', iconSize: [40, 40], iconAnchor: [20, 40] });
        const userIcon = L.icon({ iconUrl: 'img/utilizador.png', iconSize: [30, 30], iconAnchor: [15, 15] });

        let busMarker, userMarker, userCircle;
        let linha = L.polyline([], {color: '#10b981', weight: 5, opacity: 0.7}).addTo(mapa);

        new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 150, height: 150 });

        function pedirLocalizacao() {
            const geoOptions = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(pos => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    
                    if (!userMarker) {
                        userMarker = L.marker([latitude, longitude], {icon: userIcon}).addTo(mapa);
                        userCircle = L.circle([latitude, longitude], {radius: accuracy, color: 'blue', fillOpacity: 0.1}).addTo(mapa);
                    } else {
                        userMarker.setLatLng([latitude, longitude]);
                        userCircle.setLatLng([latitude, longitude]);
                        userCircle.setRadius(accuracy);
                    }
                }, (err) => alert("GPS indisponível: " + err.message), geoOptions);
            }
        }

        database.ref('/transporte').on('value', (snap) => {
            const data = snap.val();
            if (!data) return;

            if (!busMarker) {
                busMarker = L.marker([data.latitude, data.longitude], {icon: busIcon}).addTo(mapa);
            } else {
                busMarker.setLatLng([data.latitude, data.longitude]);
            }

            document.getElementById('vel').innerText = data.velocidade.toFixed(1) + " km/h";
            
            if (userMarker) {
                const u = userMarker.getLatLng();
                const dist = calcularDistancia(u.lat, u.lng, data.latitude, data.longitude);
                document.getElementById('dist').innerText = dist.toFixed(1) + " km";
                document.getElementById('eta').innerText = (dist / Math.max(data.velocidade, 5) * 60).toFixed(0) + " min";
                linha.setLatLngs([u, [data.latitude, data.longitude]]);
                mapa.fitBounds(linha.getBounds(), {padding: [50, 50]});
            }
        });

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const a = Math.sin(((lat2-lat1)*Math.PI/180)/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(((lon2-lon1)*Math.PI/180)/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
</html>
